<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plataforma Educativa de Software Libre</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js (opcional): si no hay conexión, la plataforma dibuja gráficos de respaldo en CSS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #f5f7fd;
    --bg-elevated: #ffffff;
    --panel: #ffffff;
    --panel-2: #f1f4fb;
    --border: #e3e8f5;
    --text: #232a45;
    --text-dim: #6b7290;
    --text-faint: #a2a8c2;
    --accent: #6c5ce7;
    --accent-hover: #5a48d8;
    --accent-soft: rgba(108,92,231,0.12);
    --accent2: #00c2a8;
    --accent2-soft: rgba(0,194,168,0.14);
    --accent3: #ff9f43;
    --accent3-soft: rgba(255,159,67,0.16);
    --danger: #ff6b6b;
    --danger-hover: #ef5350;
    --ok: #12b886;
    --ok-soft: rgba(18,184,134,0.12);
    --radius: 18px;
    --shadow-soft: 0 10px 26px rgba(108,92,231,0.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{ font-family:'Sora',system-ui,sans-serif; }
  #app{ min-height:100vh; display:flex; }

  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes floatBlob{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(18px,-24px) scale(1.08); } }
  @keyframes floatBlob2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-16px,20px) scale(0.95); } }

  /* ---------- LOGIN ---------- */
  .login-shell{ display:flex; width:100%; min-height:100vh; }
  .login-side{
    flex:0 0 400px;
    position:relative; overflow:hidden;
    background:linear-gradient(155deg,#7c6cf0,#6c5ce7 45%,#00c2a8 130%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px;
    text-align:center;
  }
  .login-side::before, .login-side::after{
    content:""; position:absolute; border-radius:50%; filter:blur(2px);
    background:rgba(255,255,255,0.16);
  }
  .login-side::before{ width:220px; height:220px; top:-60px; left:-60px; animation:floatBlob 9s ease-in-out infinite; }
  .login-side::after{ width:260px; height:260px; bottom:-90px; right:-70px; background:rgba(255,159,67,0.22); animation:floatBlob2 11s ease-in-out infinite; }
  .login-side .brand{ position:relative; font-size:34px; font-weight:800; letter-spacing:0.5px; color:#fff; }
  .login-side .tag{ position:relative; color:rgba(255,255,255,0.85); margin-top:10px; font-size:15px; }
  .login-main{ flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    width:100%; max-width:380px;
    padding:40px 34px;
    box-shadow:0 20px 45px rgba(108,92,231,0.14);
    animation:fadeInUp .45s ease;
  }
  .card h2{ margin:0 0 6px; font-size:26px; font-weight:700; }
  .card .sub{ color:var(--text-dim); font-size:14px; margin-bottom:26px; }
  .field{
    width:100%; padding:12px 14px; margin-bottom:14px;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-size:14px; font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field:focus{ outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 4px var(--accent-soft); }
  select.field{ appearance:none; }
  .btn{
    width:100%; padding:12px 14px; border-radius:10px; border:none;
    font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;
    background:var(--accent); color:#fff;
    transition:background .15s ease, transform .12s ease, box-shadow .15s ease;
    box-shadow:0 6px 16px rgba(108,92,231,0.25);
  }
  .btn:hover{ background:var(--accent-hover); transform:translateY(-2px); box-shadow:0 10px 22px rgba(108,92,231,0.32); }
  .btn:active{ transform:translateY(0) scale(0.98); box-shadow:0 4px 10px rgba(108,92,231,0.25); }
  .btn-outline{
    background:transparent; border:1px solid var(--border); color:var(--text);
    box-shadow:none;
  }
  .btn-outline:hover{ background:var(--panel-2); border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }
  .btn-danger{ background:var(--danger); box-shadow:0 6px 16px rgba(255,107,107,0.28); }
  .btn-danger:hover{ background:var(--danger-hover); box-shadow:0 10px 22px rgba(255,107,107,0.34); }
  .row-note{ text-align:center; color:var(--text-dim); font-size:13px; margin-top:18px; }
  .link-btn{
    background:none; border:none; color:var(--accent); font-size:13px;
    cursor:pointer; font-family:inherit; margin-top:6px; padding:6px;
    transition:color .15s ease;
  }
  .link-btn:hover{ text-decoration:underline; color:var(--accent-hover); }

  /* ---------- DASHBOARD SHELL ---------- */
  .shell{ display:flex; width:100%; min-height:100vh; }
  .sidebar{
    flex:0 0 220px; background:var(--bg-elevated); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:34px 20px;
    overflow-y:auto; max-height:100vh;
  }
  .sidebar .logo{ font-size:19px; font-weight:700; margin-bottom:36px; padding:0 6px; color:var(--accent); }
  .nav-btn{
    width:100%; text-align:left; padding:12px 14px; margin-bottom:10px;
    background:transparent; border:1px solid transparent; border-left:3px solid transparent; border-radius:10px;
    color:var(--text); font-size:14px; cursor:pointer; font-family:inherit;
    transition:background .15s ease, transform .12s ease, border-color .15s ease, color .15s ease;
  }
  .nav-btn:hover:not(:disabled){ background:var(--panel-2); transform:translateX(3px); }
  .nav-btn.active{ background:var(--accent-soft); color:var(--accent); border-left-color:var(--accent); font-weight:600; }
  .nav-btn:disabled{ color:var(--text-faint); cursor:not-allowed; }
  .nav-btn:disabled:hover{ background:transparent; transform:none; }
  .sidebar-bottom{ margin-top:auto; }
  .sidebar-bottom .nav-btn{ border-left:none; }

  .progreso-box{ margin:6px 0 16px; }
  .progreso-label{ font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:7px; }
  .progreso-bar{
    width:100%; height:8px; background:var(--panel-2); border-radius:6px;
    overflow:hidden; border:1px solid var(--border);
  }
  .progreso-fill{
    height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2));
    border-radius:6px; transition:width .3s ease; width:0%;
  }
  .progreso-text{ font-size:11px; color:var(--text-faint); margin-top:6px; }

  .modulos-list{ display:flex; flex-direction:column; margin-bottom:18px; }
  .modulo-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:12.5px; padding:9px 12px;
  }
  .modulo-btn .modulo-label{ flex:1; }
  .modulo-btn .modulo-check{ color:var(--accent2); font-weight:700; flex:none; font-size:13px; }
  .modulo-btn.current{
    background:var(--accent-soft); color:var(--accent);
    border-left-color:var(--accent); font-weight:600;
  }
  .nav-btn.btn-danger{ background:var(--danger); color:#fff; }
  .nav-btn.btn-danger:hover{ background:var(--danger-hover); color:#fff; transform:translateY(-2px); }

  .content{ flex:1; padding:40px 46px; overflow-y:auto; max-height:100vh; animation:fadeInUp .35s ease; }
  .content h1{ margin:0 0 6px; font-size:28px; }
  .content .sub{ color:var(--text-dim); margin:0 0 28px; font-size:15px; }

  .stat-row{ display:flex; gap:16px; flex-wrap:wrap; }
  .stat-card{
    background:var(--panel); border:1px solid var(--border); border-top:3px solid var(--accent); border-radius:14px;
    width:200px; padding:22px 20px; text-align:center;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .stat-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-soft); }
  .stat-card:nth-child(2){ border-top-color:var(--accent2); }
  .stat-card .num{ font-size:32px; font-weight:800; color:var(--accent); }
  .stat-card:nth-child(2) .num{ color:var(--accent2); }
  .stat-card .label{ color:var(--text-dim); font-size:13px; margin-top:6px; }

  /* ---------- FUNDAMENTOS ---------- */
  .module-title{ font-size:21px; font-weight:700; max-width:680px; line-height:1.4; }
  .section-head{ font-size:17px; font-weight:700; margin:26px 0 8px; color:var(--text); }
  .section-head.top{ font-size:19px; margin-top:6px; }
  .section-item{ color:var(--text-dim); font-size:14px; line-height:1.7; padding-left:18px; position:relative; max-width:660px; }
  .section-item::before{ content:"•"; position:absolute; left:0; color:var(--accent); }
  .obj-title{ font-weight:700; font-size:15px; margin-top:4px; }
  .obj-text{ color:var(--text-dim); font-size:14px; max-width:680px; line-height:1.6; margin-bottom:10px; }

  .cartilla-card{
    background:var(--panel); border:1px solid var(--border); border-radius:15px;
    padding:18px 22px; margin-top:26px; max-width:700px;
    box-shadow:0 6px 18px rgba(108,92,231,0.06);
    transition:box-shadow .18s ease;
  }
  .cartilla-card:hover{ box-shadow:var(--shadow-soft); }
  .cartilla-card h3{ margin:0 0 6px; font-size:16px; color:var(--accent3); }
  .cartilla-card p{ color:var(--text-dim); font-size:13px; line-height:1.6; margin:0 0 10px; }
  .cartilla-status{ color:var(--text-faint); font-size:12px; font-style:italic; margin-bottom:12px; }

  /* ---------- USUARIOS MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(35,42,69,0.45); backdrop-filter:blur(3px); display:flex;
    align-items:center; justify-content:center; z-index:50; padding:20px;
    animation:fadeInUp .2s ease;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    width:100%; max-width:640px; max-height:80vh; display:flex; flex-direction:column;
    padding:28px 0 20px; box-shadow:0 24px 60px rgba(35,42,69,0.25);
  }
  .modal h2{ text-align:center; margin:0 0 20px; font-size:22px; padding:0 24px; }
  .modal-list{ overflow-y:auto; padding:0 24px; flex:1; }
  .user-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    padding:12px 16px; margin-bottom:10px; font-size:13px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .user-row:hover{ transform:translateX(3px); box-shadow:0 4px 14px rgba(108,92,231,0.10); }
  .user-row .info{ display:flex; gap:14px; flex-wrap:wrap; color:var(--text-dim); }
  .user-row .info b{ color:var(--text); }
  .modal-close{
    margin:16px 24px 0; align-self:center;
  }
  .empty-note{ color:var(--text-faint); text-align:center; padding:30px 0; font-size:14px; }

  /* confirm dialog */
  .confirm-box{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    max-width:380px; padding:26px; text-align:center;
    box-shadow:0 24px 60px rgba(35,42,69,0.25);
    animation:fadeInUp .2s ease;
  }
  .confirm-box p{ color:var(--text-dim); font-size:14px; line-height:1.6; margin:0 0 20px; }
  .confirm-actions{ display:flex; gap:10px; }

  .toast-wrap{ position:fixed; top:22px; right:22px; z-index:100; display:flex; flex-direction:column; gap:10px; }
  .toast{
    background:var(--panel); border:1px solid var(--border); border-left:4px solid var(--accent2);
    border-radius:10px; padding:14px 18px; min-width:260px; max-width:340px;
    font-size:13px; box-shadow:0 14px 34px rgba(35,42,69,0.18);
    animation:toastIn .25s cubic-bezier(.34,1.56,.64,1);
  }
  .toast.error{ border-left-color:var(--danger); }
  .toast .t-title{ font-weight:700; margin-bottom:3px; font-size:13.5px; }
  .toast .t-body{ color:var(--text-dim); }
  @keyframes toastIn{ from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);} }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--accent); }

  /* ---------- MÓDULO 1: CONTENIDO INTERACTIVO ---------- */
  .intro-text{ color:var(--text-dim); font-size:14px; max-width:680px; line-height:1.65; margin:2px 0 16px; }
  .quote-box{
    max-width:680px; background:var(--accent2-soft); border:1px solid rgba(0,194,168,0.3);
    border-left:3px solid var(--accent2); border-radius:10px;
    padding:16px 20px; margin:6px 0 18px; font-size:13.5px; color:var(--text-dim);
    font-style:italic; line-height:1.6;
  }
  .quote-box cite{ display:block; margin-top:8px; font-style:normal; color:var(--text-faint); font-size:12px; }
  .note-box{
    max-width:680px; background:var(--accent-soft); border:1px solid rgba(108,92,231,0.3);
    border-radius:10px; padding:14px 18px; margin:0 0 22px; font-size:13px; color:var(--text-dim);
    line-height:1.6;
  }
  .note-box b{ color:var(--text); }

  details.acc{
    max-width:700px; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; margin-bottom:10px; overflow:hidden;
    transition:box-shadow .18s ease, border-color .18s ease;
  }
  details.acc[open]{ box-shadow:var(--shadow-soft); border-color:rgba(108,92,231,0.35); }
  details.acc summary{
    list-style:none; cursor:pointer; padding:14px 18px; font-weight:600; font-size:14px;
    display:flex; align-items:center; justify-content:space-between; user-select:none;
    transition:background .15s ease;
  }
  details.acc summary::-webkit-details-marker{ display:none; }
  details.acc summary::after{
    content:"+"; color:var(--accent); font-size:18px; font-weight:700; margin-left:12px; flex:none;
    transition:transform .2s ease;
  }
  details.acc[open] summary::after{ content:"+"; transform:rotate(135deg); }
  details.acc summary:hover{ background:var(--panel-2); color:var(--accent); }
  details.acc .acc-body{ padding:0 18px 18px; color:var(--text-dim); font-size:13.5px; line-height:1.7; }
  details.acc .acc-body p{ margin:0 0 10px; }
  details.acc .acc-body ul{ margin:6px 0 10px; padding-left:18px; }
  details.acc .acc-body li{ margin-bottom:6px; }
  .ref{ color:var(--text-faint); font-size:12px; }

  .card-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; max-width:700px; margin:6px 0 6px; }
  details.lic-card{
    background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:2px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  details.lic-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-soft); border-color:rgba(108,92,231,0.3); }
  details.lic-card summary{
    list-style:none; cursor:pointer; padding:14px 16px; font-weight:700; font-size:13.5px;
    display:flex; align-items:center; justify-content:space-between;
  }
  details.lic-card summary::-webkit-details-marker{ display:none; }
  details.lic-card summary::after{ content:"›"; color:var(--accent); font-size:17px; transition:transform .15s ease; }
  details.lic-card[open] summary::after{ transform:rotate(90deg); }
  details.lic-card .lic-body{ padding:0 16px 16px; color:var(--text-dim); font-size:12.5px; line-height:1.6; }
  details.lic-card .lic-example{ margin-top:8px; font-size:11.5px; color:var(--text-faint); }
  details.lic-card .lic-example b{ color:var(--accent); }

  .freedom-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:12px; max-width:700px; margin:6px 0 6px; }
  details.freedom-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  details.freedom-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-soft); }
  details.freedom-card summary{
    list-style:none; cursor:pointer; padding:16px; display:flex; align-items:center; gap:12px;
  }
  details.freedom-card summary::-webkit-details-marker{ display:none; }
  .freedom-num{
    flex:none; width:34px; height:34px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;
  }
  .freedom-label{ font-weight:600; font-size:13.5px; }
  details.freedom-card .freedom-body{ padding:0 16px 16px 62px; color:var(--text-dim); font-size:13px; line-height:1.6; }

  .compare-table{ width:100%; max-width:700px; border-collapse:collapse; font-size:13px; margin:4px 0 6px; }
  .compare-table th, .compare-table td{
    border:1px solid var(--border); padding:10px 12px; text-align:left; vertical-align:top;
  }
  .compare-table th{ background:var(--panel-2); color:var(--text); font-weight:700; }
  .compare-table td{ color:var(--text-dim); }
  .compare-table tr:hover td{ background:var(--accent-soft); }
  .compare-table td:first-child, .compare-table th:first-child{ color:var(--accent); font-weight:600; width:110px; }

  .col-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:700px; }
  .col-2 .col-card{ background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; transition:box-shadow .15s ease; }
  .col-2 .col-card:hover{ box-shadow:var(--shadow-soft); }
  .col-2 .col-card h4{ margin:0 0 8px; font-size:13px; color:var(--accent); }
  .col-2 .col-card p{ margin:0; font-size:12.5px; color:var(--text-dim); line-height:1.6; }
  @media (max-width:520px){ .col-2{ grid-template-columns:1fr; } }

  /* ---------- MÓDULOS 0 Y 2-8 (TABLA DE CONTENIDO) ---------- */
  .toc-nav{
    display:flex; flex-wrap:wrap; gap:8px; max-width:760px; margin:2px 0 26px;
  }
  .toc-nav a{
    text-decoration:none; font-size:12.5px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); border:1px solid rgba(108,92,231,0.25);
    border-radius:20px; padding:7px 14px; transition:background .15s ease, transform .12s ease;
  }
  .toc-nav a:hover{ background:var(--accent); color:#fff; transform:translateY(-2px); }

  .quiz-item{
    max-width:700px; background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:14px 18px; margin-bottom:10px;
  }
  .quiz-item .q-title{ font-weight:600; font-size:13.5px; margin-bottom:8px; }
  .quiz-item label{
    display:block; font-size:13px; color:var(--text-dim); padding:6px 8px; border-radius:8px;
    cursor:pointer; transition:background .12s ease;
  }
  .quiz-item label:hover{ background:var(--panel-2); }
  .quiz-item input[type=radio]{ margin-right:8px; accent-color:var(--accent); }
  .quiz-note{
    max-width:700px; font-size:12.5px; color:var(--text-faint); font-style:italic; margin:4px 0 20px;
  }

  /* ===== PRUEBA DIAGNÓSTICA: NOTA Y ESTADÍSTICAS ===== */
  .q-feedback{ font-size:12.5px; margin-top:8px; padding-left:8px; }
  .q-feedback:empty{ margin-top:0; }
  .fb-ok{ color:var(--ok); font-weight:600; }
  .fb-bad{ color:var(--danger); font-weight:600; }
  .fb-none{ color:var(--text-faint); font-weight:600; }
  .quiz-item.q-ok{ border-color:var(--ok); background:var(--ok-soft); }
  .quiz-item.q-bad{ border-color:var(--danger); background:rgba(255,107,107,0.07); }
  .quiz-item.q-none{ border-color:var(--accent3); background:var(--accent3-soft); }

  .quiz-actions{ display:flex; gap:10px; flex-wrap:wrap; max-width:700px; margin:16px 0 8px; }

  .nota-panel{
    max-width:700px; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:22px; margin:6px 0 22px; box-shadow:var(--shadow-soft);
  }
  .nota-top{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:20px; }
  .nota-circulo{
    flex:none; width:104px; height:104px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:5px solid var(--ok); background:var(--ok-soft);
  }
  .nota-circulo.nota-reprueba{ border-color:var(--danger); background:rgba(255,107,107,0.10); }
  .nota-valor{ font-size:30px; font-weight:800; line-height:1; color:var(--text); }
  .nota-sobre{ font-size:12px; color:var(--text-faint); margin-top:3px; }
  .nota-resumen{ flex:1; min-width:200px; }
  .nota-titulo{ font-size:16px; font-weight:700; margin-bottom:8px; }
  .nota-fecha{ font-size:12px; color:var(--text-faint); margin-top:8px; }
  .nivel-badge{
    display:inline-block; font-size:12.5px; font-weight:700; padding:5px 14px; border-radius:20px;
  }
  .nivel-alto{ color:var(--ok); background:var(--ok-soft); }
  .nivel-medio{ color:var(--accent); background:var(--accent-soft); }
  .nivel-bajo{ color:var(--accent3); background:var(--accent3-soft); }
  .nivel-inicial{ color:var(--danger); background:rgba(255,107,107,0.12); }

  .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:10px; margin-bottom:18px; }
  .stat-card{
    background:var(--panel-2); border:1px solid var(--border); border-radius:14px;
    padding:14px 10px; text-align:center;
  }
  .stat-num{ font-size:24px; font-weight:800; line-height:1.1; }
  .stat-lbl{ font-size:11.5px; color:var(--text-dim); margin-top:4px; }

  .stat-barra-wrap{ margin-bottom:18px; }
  .stat-barra{
    width:100%; height:12px; background:var(--panel-2); border:1px solid var(--border);
    border-radius:8px; overflow:hidden;
  }
  .stat-barra-fill{
    height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2));
    border-radius:8px; transition:width .5s ease;
  }
  .stat-barra-txt{ font-size:12px; color:var(--text-dim); margin-top:7px; }

  .perfil-box{
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:14px; padding:14px 16px; margin-bottom:14px;
  }
  .perfil-titulo{ font-size:13px; font-weight:700; margin-bottom:10px; }
  .perfil-row{
    display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
    font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--border);
  }
  .perfil-row:last-child{ border-bottom:none; }
  .perfil-q{ color:var(--text-dim); flex:1; min-width:160px; }
  .perfil-a{ color:var(--accent); font-weight:600; text-align:right; }

  .reco-box{
    font-size:13px; line-height:1.55; color:var(--text);
    background:var(--accent-soft); border-left:3px solid var(--accent);
    border-radius:10px; padding:12px 14px;
  }

  .step-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:12px; max-width:700px; margin:6px 0 6px; }
  details.step-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  details.step-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-soft); }
  details.step-card summary{
    list-style:none; cursor:pointer; padding:16px; display:flex; align-items:center; gap:12px;
  }
  details.step-card summary::-webkit-details-marker{ display:none; }
  .step-num{
    flex:none; width:34px; height:34px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent3),var(--accent2)); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;
  }
  .step-label{ font-weight:600; font-size:13.5px; }
  details.step-card .step-body{ padding:0 16px 16px 62px; color:var(--text-dim); font-size:13px; line-height:1.6; }

  .ref-box{
    max-width:700px; background:var(--panel-2); border:1px solid var(--border); border-radius:12px;
    padding:16px 20px; margin:26px 0 10px; font-size:12.5px; color:var(--text-dim); line-height:1.8;
  }
  .ref-box .ref-title{ font-weight:700; color:var(--text); font-size:14px; margin-bottom:8px; }

  /* ================================================================
     ================  NUEVO EN LA VERSIÓN 6  =======================
     ================================================================ */

  @keyframes popIn{ from{ opacity:0; transform:scale(.88); } to{ opacity:1; transform:scale(1); } }
  @keyframes slideUp{ from{ opacity:0; transform:translateY(26px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes pulseSoft{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
  @keyframes shimmer{ 0%{ background-position:-380px 0; } 100%{ background-position:380px 0; } }

  /* ---------- NIVELES ---------- */
  .nivel-chip{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; font-weight:700; padding:7px 16px; border-radius:22px;
    border:1px solid transparent;
  }
  .chip-inicial{ color:#e8590c; background:rgba(255,159,67,0.16); border-color:rgba(255,159,67,0.45); }
  .chip-basico{ color:#1971c2; background:rgba(25,113,194,0.12); border-color:rgba(25,113,194,0.35); }
  .chip-intermedio{ color:var(--accent); background:var(--accent-soft); border-color:rgba(108,92,231,0.4); }
  .chip-avanzado{ color:#0c8f70; background:var(--ok-soft); border-color:rgba(18,184,134,0.4); }

  /* ---------- PANTALLA DE DIAGNÓSTICO OBLIGATORIO ---------- */
  .gate-box{
    max-width:720px; background:linear-gradient(135deg,rgba(108,92,231,0.10),rgba(0,194,168,0.10));
    border:1px solid rgba(108,92,231,0.30); border-radius:var(--radius);
    padding:26px 28px; margin:6px 0 24px; animation:slideUp .4s ease;
  }
  .gate-box h3{ margin:0 0 8px; font-size:19px; }
  .gate-box p{ margin:0 0 16px; color:var(--text-dim); font-size:14px; line-height:1.65; }
  .gate-locked-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .gate-locked-item{
    font-size:12px; font-weight:600; color:var(--text-faint);
    background:var(--panel-2); border:1px dashed var(--border);
    border-radius:20px; padding:7px 13px;
  }

  .nav-btn.bloqueado{ color:var(--text-faint); }
  .nav-btn.bloqueado:hover{ background:rgba(255,107,107,0.08); transform:none; }
  .modulo-lock{ font-size:12px; flex:none; opacity:.8; }

  /* ---------- FLUJO / RUTA ---------- */
  .flujo{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; max-width:760px; margin:10px 0 24px; }
  .flujo-paso{
    display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600;
    background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:7px 13px;
    color:var(--text-dim); transition:transform .15s ease, box-shadow .15s ease;
  }
  .flujo-paso:hover{ transform:translateY(-2px); box-shadow:var(--shadow-soft); }
  .flujo-paso.ok{ border-color:rgba(18,184,134,0.45); color:var(--ok); background:var(--ok-soft); }
  .flujo-paso.actual{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .flujo-flecha{ color:var(--text-faint); font-size:13px; }

  /* ---------- TARJETAS VISUALES DE CONCEPTOS ---------- */
  .bloque-inter{ max-width:760px; margin:18px 0 28px; }
  .bloque-inter-titulo{
    font-size:14px; font-weight:700; margin:0 0 4px; display:flex; align-items:center; gap:8px;
  }
  .bloque-inter-sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:12px; }

  .concept-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(168px,1fr)); gap:14px;
  }
  .concept-card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:12px 12px 14px; text-align:center; cursor:pointer; overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation:popIn .3s ease;
  }
  .concept-card:hover{
    transform:translateY(-6px) scale(1.03);
    box-shadow:0 16px 32px rgba(108,92,231,0.18);
    border-color:var(--accent);
  }
  .concept-card:hover .concept-hint{ color:var(--accent); opacity:1; }
  .concept-card:active{ transform:translateY(-2px) scale(.99); }
  .concept-img{
    width:100%; height:108px; border-radius:12px; overflow:hidden; margin-bottom:10px;
    display:flex; align-items:center; justify-content:center; background:var(--panel-2);
  }
  .concept-img svg{ width:100%; height:100%; display:block; }
  .concept-name{ font-size:13.5px; font-weight:700; }
  .concept-tag{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
  .concept-hint{ font-size:11px; color:var(--text-faint); margin-top:8px; opacity:.85; transition:color .15s ease; }

  /* ---------- MODAL DE CONCEPTO ---------- */
  .modal-concepto{
    background:var(--panel); border:1px solid var(--border); border-radius:18px;
    width:100%; max-width:560px; max-height:86vh; overflow-y:auto;
    box-shadow:0 26px 60px rgba(35,42,69,0.28); animation:popIn .25s ease;
  }
  .mc-head{ display:flex; gap:16px; align-items:center; padding:22px 24px 6px; }
  .mc-img{ flex:none; width:96px; height:96px; border-radius:14px; overflow:hidden; background:var(--panel-2); }
  .mc-img svg{ width:100%; height:100%; display:block; }
  .mc-title{ font-size:20px; font-weight:800; font-family:'Sora',sans-serif; }
  .mc-sub{ font-size:12.5px; color:var(--text-dim); margin-top:4px; }
  .mc-body{ padding:8px 24px 6px; }
  .mc-item{ margin-bottom:12px; }
  .mc-item h5{ margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--accent); }
  .mc-item p{ margin:0; font-size:13px; line-height:1.6; color:var(--text-dim); }
  .mc-licencia{
    display:inline-block; font-size:11.5px; font-weight:700; color:var(--accent2);
    background:var(--accent2-soft); border-radius:18px; padding:5px 12px; margin-top:2px;
  }
  .mc-foot{ padding:8px 24px 22px; display:flex; justify-content:flex-end; }

  /* ---------- DESCUBRE EL CONCEPTO ---------- */
  .descubre-box{
    background:var(--panel-2); border:1px solid var(--border); border-radius:16px; padding:16px 18px;
  }
  .descubre-opciones{ display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 4px; }
  .descubre-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:10px 16px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:600;
    color:var(--text); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .descubre-btn:hover{ transform:translateY(-4px); border-color:var(--accent); box-shadow:var(--shadow-soft); }
  .descubre-btn.activo{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .descubre-panel{
    margin-top:12px; font-size:13px; line-height:1.65; color:var(--text-dim);
    background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--accent2);
    border-radius:12px; padding:14px 16px; animation:slideUp .3s ease;
  }
  .descubre-panel b{ color:var(--text); }
  .descubre-pregunta{ font-weight:700; color:var(--accent); margin-bottom:6px; font-size:13px; }

  /* ---------- ASOCIACIÓN VISUAL ---------- */
  .asoc-box{ background:var(--panel-2); border:1px solid var(--border); border-radius:16px; padding:16px 18px; }
  .asoc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px; }
  @media (max-width:560px){ .asoc-grid{ grid-template-columns:1fr; } }
  .asoc-col-tit{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint); margin-bottom:8px; }
  .asoc-item{
    display:block; width:100%; text-align:left; font-family:inherit; font-size:12.5px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-bottom:8px; cursor:pointer; color:var(--text);
    transition:transform .14s ease, border-color .14s ease, background .14s ease;
  }
  .asoc-item:hover{ transform:translateX(3px); border-color:var(--accent); }
  .asoc-item.sel{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .asoc-item.ok{ border-color:var(--ok); background:var(--ok-soft); color:var(--ok); font-weight:600; cursor:default; }
  .asoc-item.ok:hover{ transform:none; }
  .asoc-item.fail{ border-color:var(--danger); background:rgba(255,107,107,0.10); animation:pulseSoft .3s ease; }
  .asoc-feedback{ font-size:12.5px; margin-top:10px; min-height:18px; line-height:1.55; }
  .asoc-feedback.ok{ color:var(--ok); }
  .asoc-feedback.bad{ color:var(--danger); }
  .asoc-progreso{ font-size:11.5px; color:var(--text-faint); margin-top:6px; }

  /* ---------- PANEL DEL ESTUDIANTE ---------- */
  .dash-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:16px;
    max-width:900px; margin-bottom:22px;
  }
  .dash-card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:18px 20px; border-top:3px solid var(--accent);
    transition:transform .18s ease, box-shadow .18s ease; animation:slideUp .35s ease;
  }
  .dash-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-soft); }
  .dash-card.c2{ border-top-color:var(--accent2); }
  .dash-card.c3{ border-top-color:var(--accent3); }
  .dash-card.c4{ border-top-color:var(--ok); }
  .dash-card .dc-lbl{ font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); margin-bottom:8px; }
  .dash-card .dc-val{ font-size:23px; font-weight:800; font-family:'Sora',sans-serif; }
  .dash-card .dc-note{ font-size:12px; color:var(--text-dim); margin-top:7px; line-height:1.55; }
  .dash-wide{ grid-column:1 / -1; }

  /* ---------- PANEL ADMINISTRADOR ---------- */
  .admin-kpis{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-bottom:26px; }
  .kpi{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:16px 14px; text-align:center; border-top:3px solid var(--accent);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .kpi:hover{ transform:translateY(-4px); box-shadow:var(--shadow-soft); }
  .kpi .kpi-num{ font-size:26px; font-weight:800; font-family:'Sora',sans-serif; }
  .kpi .kpi-lbl{ font-size:11.5px; color:var(--text-dim); margin-top:5px; }
  .kpi.k2{ border-top-color:var(--accent2); }
  .kpi.k3{ border-top-color:var(--accent3); }
  .kpi.k4{ border-top-color:var(--ok); }
  .kpi.k5{ border-top-color:var(--danger); }

  .panel-box{
    background:var(--panel); border:1px solid var(--border); border-radius:18px;
    padding:20px 22px; margin-bottom:22px;
  }
  .panel-box h3{ margin:0 0 4px; font-size:16px; }
  .panel-box .pb-sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:14px; }

  .charts-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:18px; }
  .chart-box{
    background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px 18px;
  }
  .chart-box h4{ margin:0 0 12px; font-size:13.5px; }
  .chart-canvas-wrap{ position:relative; height:230px; }

  /* Gráficos de respaldo (sin Chart.js) */
  .fallback-bars{ display:flex; flex-direction:column; gap:10px; }
  .fb-row{ display:flex; align-items:center; gap:10px; font-size:12px; }
  .fb-lbl{ flex:0 0 108px; color:var(--text-dim); }
  .fb-track{ flex:1; height:14px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .fb-fill{ height:100%; border-radius:8px; transition:width .6s ease; }
  .fb-val{ flex:0 0 46px; text-align:right; font-weight:700; }

  .filtros{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .filtro-btn{
    font-family:inherit; font-size:12px; font-weight:600; cursor:pointer;
    background:var(--panel-2); color:var(--text-dim);
    border:1px solid var(--border); border-radius:20px; padding:7px 14px;
    transition:background .15s ease, color .15s ease, transform .12s ease;
  }
  .filtro-btn:hover{ transform:translateY(-2px); color:var(--accent); border-color:var(--accent); }
  .filtro-btn.activo{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .buscador{
    flex:1; min-width:180px; padding:9px 12px; font-family:inherit; font-size:12.5px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px; color:var(--text);
  }
  .buscador:focus{ outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 4px var(--accent-soft); }

  .tabla-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; }
  .tabla-est{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:660px; }
  .tabla-est th{
    background:var(--panel-2); text-align:left; padding:11px 13px; font-weight:700;
    cursor:pointer; user-select:none; white-space:nowrap; border-bottom:1px solid var(--border);
  }
  .tabla-est th:hover{ color:var(--accent); }
  .tabla-est th .orden-ind{ color:var(--accent); font-size:10px; margin-left:4px; }
  .tabla-est td{ padding:10px 13px; border-bottom:1px solid var(--border); color:var(--text-dim); vertical-align:middle; }
  .tabla-est tr:last-child td{ border-bottom:none; }
  .tabla-est tbody tr:hover td{ background:var(--accent-soft); }
  .tabla-est td b{ color:var(--text); }
  .badge-estado{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:14px; white-space:nowrap; }
  .estado-ok{ color:var(--ok); background:var(--ok-soft); }
  .estado-pend{ color:var(--accent3); background:var(--accent3-soft); }
  .tabla-vacia{ text-align:center; color:var(--text-faint); padding:26px 0; font-size:13px; }

  .lista-recientes{ display:flex; flex-direction:column; gap:9px; }
  .reciente-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:11px 14px; font-size:12.5px;
  }
  .reciente-row:hover{ border-color:var(--accent); }

  /* ---------- RESULTADO ANIMADO ---------- */
  .resultado-anim{ animation:slideUp .45s ease; }
  .nota-circulo.anim{ animation:popIn .5s cubic-bezier(.34,1.56,.64,1); }
  .retro-box{
    background:linear-gradient(135deg,rgba(0,194,168,0.10),rgba(108,92,231,0.10));
    border:1px solid rgba(0,194,168,0.30); border-radius:14px; padding:15px 17px; margin-bottom:14px;
  }
  .retro-titulo{ font-size:13.5px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:7px; }
  .retro-texto{ font-size:13px; color:var(--text-dim); line-height:1.65; }
  .ruta-lista{ margin:8px 0 0; padding-left:18px; font-size:12.5px; color:var(--text-dim); line-height:1.8; }
  .ruta-lista li::marker{ color:var(--accent); }
  .acciones-resultado{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }

  .aviso-intentos{ font-size:11.5px; color:var(--text-faint); margin-top:10px; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:900px){
    .login-side{ flex:0 0 260px; }
    .content{ padding:28px 22px; }
  }
  @media (max-width:760px){
    #app{ display:block; }
    .shell{ flex-direction:column; min-height:auto; }
    .login-shell{ flex-direction:column; }
    .login-side{ flex:none; min-height:180px; padding:26px; }
    .sidebar{
      flex:none; width:100%; max-height:none; flex-direction:column;
      padding:16px 16px 10px; border-right:none; border-bottom:1px solid var(--border);
    }
    .sidebar .logo{ margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
    .sidebar.colapsado .nav-oculto{ display:none; }
    .btn-menu{
      display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-size:12px; font-weight:700;
      background:var(--accent-soft); color:var(--accent); border:1px solid rgba(108,92,231,0.3);
      border-radius:10px; padding:7px 12px; cursor:pointer;
    }
    .sidebar-bottom{ margin-top:10px; }
    .content{ max-height:none; padding:24px 18px 40px; }
    .concept-grid{ grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); }
    .dash-grid, .admin-kpis, .charts-grid{ grid-template-columns:1fr; }
    .nota-top{ justify-content:center; text-align:center; }
    .mc-head{ flex-direction:column; text-align:center; }
  }
  .btn-menu{ display:none; }
  @media (max-width:760px){ .btn-menu{ display:inline-flex; } }
  @media (max-width:560px){
    .modulo-nav{ flex-direction:column; align-items:stretch; }
    .modulo-nav-btn{ max-width:100%; }
    .modulo-nav-btn.siguiente{ text-align:left; align-items:flex-start; margin-left:0; }
  }

  .nav-oculto{ display:flex; flex-direction:column; flex:1; }
  .sidebar .logo{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============ ESTADO ============ */
let usuarios = [];          // lista cargada desde window.storage
let cartillaNombre = null;  // nombre del archivo "cargado"
let sesion = null;          // { id, nombre, usuario, rol }
let vista = "login";        // login | registro | dashboard | fundamentos
let moduloActivo = "mod0";  // módulo que se muestra en la vista "fundamentos" (cada módulo es independiente)

const STORAGE_KEY_USUARIOS = "usuarios_db";
const STORAGE_KEY_CARTILLA = "cartilla_nombre";

/* ============ UTILIDADES ============ */
async function encriptarContrasena(texto){
  const data = new TextEncoder().encode(texto);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function toast(title, body, isError){
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.innerHTML = `<div class="t-title">${title}</div><div class="t-body">${body}</div>`;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ============ CAPA DE ALMACENAMIENTO ============ */
/* Usa window.storage si está disponible (visor de artefactos).
   Si no existe o falla, cae automáticamente a localStorage y,
   como último recurso, a memoria durante la sesión actual.      */
const Almacenamiento = {
  memoria: {},
  usaRespaldo: false,
  avisoMostrado: false,

  get soportaStorage(){
    return typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
  },
  get soportaLocal(){
    try{
      const k = "__test__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return true;
    }catch(e){ return false; }
  },

  async get(clave){
    if(this.soportaStorage && !this.usaRespaldo){
      try{
        const res = await window.storage.get(clave);
        return res ? res.value : null;
      }catch(e){
        // La clave puede no existir todavía: no es un error real.
        if(this.soportaLocal){
          const local = localStorage.getItem(clave);
          if(local !== null) return local;
        }
        return null;
      }
    }
    if(this.soportaLocal) return localStorage.getItem(clave);
    return clave in this.memoria ? this.memoria[clave] : null;
  },

  async set(clave, valor){
    // Siempre se guarda una copia local para no perder datos si falla la nube.
    if(this.soportaLocal){
      try{ localStorage.setItem(clave, valor); }catch(e){ /* cuota llena */ }
    }
    this.memoria[clave] = valor;

    if(this.soportaStorage && !this.usaRespaldo){
      try{
        await window.storage.set(clave, valor);
        return true;
      }catch(e){
        this.usaRespaldo = true;
        this.avisarRespaldo();
        return this.soportaLocal;
      }
    }

    if(!this.soportaStorage) this.avisarRespaldo();
    return this.soportaLocal;
  },

  avisarRespaldo(){
    if(this.avisoMostrado) return;
    this.avisoMostrado = true;
    if(!this.soportaLocal){
      toast("Modo temporal", "Los cambios sólo durarán mientras la página esté abierta.", true);
    }
    // Con localStorage disponible el guardado funciona bien: no se muestra error.
  }
};

async function cargarUsuarios(){
  const administradoresMaestros = [
    { id: 1, nombre: "Cristian", usuario: "Cristian", contrasena: await encriptarContrasena("12345"), rol: "Administrador", protegido: true, progreso: [] },
    { id: 2, nombre: "Javier", usuario: "Javier", contrasena: await encriptarContrasena("12345"), rol: "Administrador", protegido: true, progreso: [] }
  ];

  try{
    const bruto = await Almacenamiento.get(STORAGE_KEY_USUARIOS);
    usuarios = bruto ? JSON.parse(bruto) : [];
    if(!Array.isArray(usuarios)) usuarios = [];
  }catch(e){
    usuarios = [];
  }

  administradoresMaestros.forEach(admin => {
    const existente = usuarios.find(u => u.usuario.toLowerCase() === admin.usuario.toLowerCase());
    if(!existente){
      usuarios.push(admin);
    }else{
      existente.nombre = admin.nombre;
      existente.usuario = admin.usuario;
      existente.contrasena = admin.contrasena;
      existente.rol = "Administrador";
      existente.protegido = true;
    }
  });

  // Compatibilidad con usuarios guardados en versiones anteriores
  usuarios.forEach(u => {
    if(!Array.isArray(u.progreso)) u.progreso = [];
    if(!Array.isArray(u.historialDiagnostico)) u.historialDiagnostico = [];
    if(u.diagnostico && typeof u.diagnostico === "object"){
      const d = u.diagnostico;
      if(d.completado === undefined) d.completado = true;
      if(!d.nivel) d.nivel = nivelPorPorcentaje(Number(d.porcentaje) || 0);
      if(!d.retroalimentacion) d.retroalimentacion = RETROALIMENTACION[d.nivel];
      if(!d.intentos) d.intentos = 1;
      if(!d.timestamp) d.timestamp = Date.now();
      if(d.completado && !u.progreso.includes("mod0")) u.progreso.push("mod0");
    }
  });

  await guardarUsuarios();
}

async function guardarUsuarios(){
  await Almacenamiento.set(STORAGE_KEY_USUARIOS, JSON.stringify(usuarios));
}

/* Guardado agrupado: evita muchas escrituras seguidas al hacer scroll */
let guardadoPendiente = null;
function guardarUsuariosDiferido(){
  if(guardadoPendiente) clearTimeout(guardadoPendiente);
  guardadoPendiente = setTimeout(() => {
    guardadoPendiente = null;
    guardarUsuarios();
  }, 600);
}

async function cargarCartillaGuardada(){
  try{
    cartillaNombre = await Almacenamiento.get(STORAGE_KEY_CARTILLA);
  }catch(e){
    cartillaNombre = null;
  }
}

async function guardarCartilla(nombre){
  cartillaNombre = nombre;
  await Almacenamiento.set(STORAGE_KEY_CARTILLA, nombre);
}

function siguienteId(){
  return usuarios.length ? Math.max(...usuarios.map(u => u.id)) + 1 : 1;
}

/* ============ RENDER RAÍZ ============ */
function render(){
  const app = document.getElementById("app");
  if(vista === "login") app.innerHTML = vistaLogin();
  else if(vista === "registro") app.innerHTML = vistaRegistro();
  else if(vista === "dashboard") app.innerHTML = vistaDashboard();
  else if(vista === "fundamentos") app.innerHTML = vistaFundamentos();
  else if(vista === "estadisticas") app.innerHTML = vistaEstadisticas();
  else app.innerHTML = vistaLogin();
  bindEventos();
}

/* ============ LOGIN ============ */
function vistaLogin(){
  return `
  <div class="login-shell">
    <div class="login-side">
      <div class="brand">Software Libre</div>
      <div class="tag">Plataforma educativa interactiva<br>Fundamentos · Licencias · Herramientas · Comunidad</div>
    </div>
    <div class="login-main">
      <div class="card">
        <h2>Bienvenido</h2>
        <div class="sub">Ingresar credenciales para continuar</div>
        <input class="field" id="loginUsuario" placeholder="Usuario" autocomplete="username">
        <input class="field" id="loginPass" type="password" placeholder="Contraseña" autocomplete="current-password">
        <button class="btn" id="btnIniciarSesion">INICIAR SESIÓN</button>

/* Línea de flujo: Diagnóstico → Módulo 1 → Módulo 2 … Cada paso es un acceso directo
   al módulo correspondiente (cada módulo se abre de forma independiente). */
function flujoAprendizaje(u){
  const diagOk = tieneDiagnostico(u);
  const progreso = (u && Array.isArray(u.progreso)) ? u.progreso : [];
  const pasos = MODULOS_FUNDAMENTOS.map(m => {
    if(m.id === "mod0"){
      return `<button class="flujo-paso ${diagOk ? "ok" : "actual"}" data-ir-modulo="mod0">${diagOk ? "✓ " : ""}Diagnóstico</button>`;
    }
    const visto = progreso.includes(m.id);
    const bloqueado = !diagOk;
    const cls = visto ? "ok" : "";
    const icono = visto ? "✓" : (diagOk ? "○" : "·");
    return `<button class="flujo-paso ${cls}" data-ir-modulo="${m.id}" ${bloqueado ? `data-bloqueado="1"` : ``}>${icono} ${escapeHtml(m.label)}</button>`;
  });
  return `<div class="flujo">${pasos.join('<span class="flujo-flecha">→</span>')}</div>`;
}

/* Califica la prueba, calcula el nivel, guarda el resultado y desbloquea los módulos */
async function calificarDiagnostico(){
  // 1) Validación: no se permite finalizar con preguntas sin responder
  const faltantes = [];
  DIAGNOSTICO.forEach((item, i) => {
    if(!document.querySelector(`input[name="diag${i}"]:checked`)) faltantes.push(i + 1);
  });
  if(faltantes.length){
    toast("Diagnóstico incompleto", `No puedes finalizar el diagnóstico. Te faltan ${faltantes.length} pregunta(s): ${faltantes.join(", ")}.`, true);
    const primero = document.getElementById(`quizItem${faltantes[0] - 1}`);
    if(primero){
      primero.classList.add("q-none");
      primero.scrollIntoView({ behavior:"smooth", block:"center" });
    }
    return;
  }

  let correctas = 0, incorrectas = 0, sinResponder = 0;
  const respuestas = {};
  const perfil = [];

  DIAGNOSTICO.forEach((item, i) => {
    const marcado = document.querySelector(`input[name="diag${i}"]:checked`);
    let valor = marcado ? parseInt(marcado.value, 10) : null;
    // 2) Validación de rango: ninguna respuesta puede quedar fuera de las opciones
    if(valor !== null && (isNaN(valor) || valor < 0 || valor >= item.o.length)) valor = null;
    respuestas[i] = valor;

    const feedback = document.getElementById(`qFeedback${i}`);
    const contenedor = document.getElementById(`quizItem${i}`);
    if(contenedor) contenedor.classList.remove("q-ok","q-bad","q-none");

    if(item.tipo === "perfil"){
      perfil.push({ q: item.q, r: valor !== null ? item.o[valor] : null });
      if(feedback) feedback.innerHTML = "";
      return;
    }

    if(valor === null){
      sinResponder++;
      if(contenedor) contenedor.classList.add("q-none");
      if(feedback) feedback.innerHTML = `<span class="fb-none">Sin responder — la respuesta correcta es: ${escapeHtml(item.o[item.c])}</span>`;
    }else if(valor === item.c){
      correctas++;
      if(contenedor) contenedor.classList.add("q-ok");
      if(feedback) feedback.innerHTML = `<span class="fb-ok">✓ Respuesta correcta</span>`;
    }else{
      incorrectas++;
      if(contenedor) contenedor.classList.add("q-bad");
      if(feedback) feedback.innerHTML = `<span class="fb-bad">✗ Incorrecta — la correcta es: ${escapeHtml(item.o[item.c])}</span>`;
    }
  });

  const porcentaje = TOTAL_CONOCIMIENTO ? Math.round((correctas / TOTAL_CONOCIMIENTO) * 100) : 0;
  const nota = Math.round((porcentaje / 100) * 5 * 10) / 10;
  const nivel = nivelPorPorcentaje(porcentaje);

  const recomendacion =
    porcentaje >= 90 ? "Excelente base. Puedes avanzar directamente a los módulos de licencias, comunidades y proyecto final." :
    porcentaje >= 70 ? "Buena base. Refuerza el módulo 2 (Licencias) para afianzar los conceptos jurídicos." :
    porcentaje >= 50 ? "Base parcial. Revisa con detenimiento los módulos 1 (Fundamentos) y 2 (Licencias)." :
                       "Se recomienda iniciar desde el módulo 1 (Fundamentos) y avanzar de forma secuencial.";

  const usuarioActual = usuarioActualObj();
  const intentosPrevios = (usuarioActual && usuarioActual.diagnostico && usuarioActual.diagnostico.intentos) || 0;

  const resultado = {
    completado: true,
    nota, porcentaje, correctas, incorrectas, sinResponder,
    totalConocimiento: TOTAL_CONOCIMIENTO,
    respuestas, perfil, recomendacion,
    nivel,
    retroalimentacion: RETROALIMENTACION[nivel],
    intentos: intentosPrevios + 1,
    timestamp: Date.now(),
    fecha: new Date().toLocaleString("es-CO", { dateStyle:"medium", timeStyle:"short" })
  };

  if(usuarioActual){
    // Historial breve de los últimos intentos
    const historial = Array.isArray(usuarioActual.historialDiagnostico) ? usuarioActual.historialDiagnostico : [];
    historial.push({ fecha: resultado.fecha, porcentaje, nota, nivel, intento: resultado.intentos });
    usuarioActual.historialDiagnostico = historial.slice(-5);

    usuarioActual.diagnostico = resultado;
    if(!Array.isArray(usuarioActual.progreso)) usuarioActual.progreso = [];
    if(!usuarioActual.progreso.includes("mod0")) usuarioActual.progreso.push("mod0");
    await guardarUsuarios();
  }

  const panel = document.getElementById("panelNota");
  if(panel){
    panel.innerHTML = panelNotaHtml(resultado, true);
    panel.scrollIntoView({ behavior:"smooth", block:"center" });
    const btnSeguir = document.getElementById("btnContinuarCurso");
    if(btnSeguir) btnSeguir.addEventListener("click", () => irAModulo("mod1"));
  }

  toast("Diagnóstico completado correctamente", `Nota ${nota.toFixed(1)} / 5.0 · ${porcentaje}% de aciertos.`);
  setTimeout(() => toast("Nivel alcanzado", `Has alcanzado el nivel ${nivel}.`), 700);
  setTimeout(() => toast("Módulos desbloqueados", "Ya puedes acceder a todo el contenido educativo."), 1400);

  // Se vuelve a dibujar la vista para desbloquear el menú lateral y los módulos
  setTimeout(() => {
    const y = document.getElementById("panelNota");
    const abierto = !!y;
    render();
    if(abierto){
      const p = document.getElementById("panelNota");
      if(p) p.scrollIntoView({ behavior:"auto", block:"center" });
    }
  }, 1800);
}

async function reiniciarDiagnostico(){
  DIAGNOSTICO.forEach((item, i) => {
    document.querySelectorAll(`input[name="diag${i}"]`).forEach(r => { r.checked = false; });
    const fb = document.getElementById(`qFeedback${i}`);
    if(fb) fb.innerHTML = "";
    const cont = document.getElementById(`quizItem${i}`);
    if(cont) cont.classList.remove("q-ok","q-bad","q-none");
  });

  const panel = document.getElementById("panelNota");
  if(panel) panel.innerHTML = "";

  toast("Prueba reiniciada", "Puedes responder nuevamente la prueba diagnóstica. Tu último resultado guardado se conserva hasta que finalices un nuevo intento.");
}

       </button>`
    : `<span></span>`;

  const siguienteBloqueado = siguiente && siguiente.id !== "mod0" && !desbloqueado;
  const btnSiguiente = siguiente
    ? `<button class="modulo-nav-btn siguiente" data-ir-modulo="${siguiente.id}" ${siguienteBloqueado ? "disabled" : ""}>
         <span class="modulo-nav-lbl">${siguienteBloqueado ? "Bloqueado" : "Módulo siguiente"}</span>
         <span class="modulo-nav-txt">${escapeHtml(siguiente.label)}</span>
       </button>`
    : `<span></span>`;

  return `<div class="modulo-nav">${btnAnterior}${btnSiguiente}</div>`;
}

/* Construye el contenido de un único módulo (independiente del resto) */
function renderModuloActivo(){
  const idx = MODULOS_FUNDAMENTOS.findIndex(m => m.id === moduloActivo);
  const posicion = `<div class="modulo-posicion">Módulo ${idx + 1} de ${MODULOS_FUNDAMENTOS.length}</div>`;

  if(moduloActivo === "mod0"){
    return `
      ${posicion}
      <div class="module-title">Prueba diagnóstica</div>
      <div class="obj-text">Antes de acceder al contenido del curso, evalúa tus conocimientos previos sobre Software Libre para conocer tu nivel y recibir una ruta de aprendizaje personalizada.</div>
      ${renderSeccion0()}
      ${navegacionModulos("mod0")}
      ${cartillaCardHtml()}
    `;
  }

  const render = RENDER_SECCION[moduloActivo];
  if(!render) return posicion + renderSeccion0();

  return `
    ${posicion}
    ${bannerModulo(moduloActivo)}
    ${render()}
    ${galeriaModulo(moduloActivo)}
    ${bloqueInteractivo(moduloActivo)}
    ${componenteModulo(moduloActivo)}
    ${bloqueVerdaderoFalso(moduloActivo)}
    ${bloqueProyecto(moduloActivo)}
    ${moduloActivo === "mod8" ? renderReferencias() : ""}
    ${navegacionModulos(moduloActivo)}
    ${moduloActivo === "mod8" ? cartillaCardHtml() : ""}
  `;
}

function vistaFundamentos(){
  const esAdmin = sesion.rol === "Administrador";
  const u = usuarioActualObj() || {};
  const desbloqueado = modulosDesbloqueados();

  // Si el módulo activo quedó bloqueado (por ejemplo, se reinició el diagnóstico), se vuelve al módulo 0
  if(moduloActivo !== "mod0" && !desbloqueado) moduloActivo = "mod0";

  const gate = moduloActivo === "mod0" && !desbloqueado ? `
    <div class="gate-box">
      <h3>Antes de comenzar los módulos debes completar la prueba diagnóstica.</h3>
      <p>Responde las ${DIAGNOSTICO.length} preguntas del diagnóstico inicial. Al finalizar conocerás tu nivel,
      recibirás retroalimentación personalizada y se desbloqueará todo el contenido educativo.</p>
      <div class="gate-locked-list">
        ${MODULOS_FUNDAMENTOS.filter(m => m.id !== "mod0").map(m => `<span class="gate-locked-item">Bloqueado · ${escapeHtml(m.label)}</span>`).join("")}
      </div>
    </div>` : "";

  return `
  <div class="shell">
    ${sidebarFundamentos()}
    <div class="content" id="contenidoModulo">
      ${flujoAprendizaje(u)}
      ${gate}
      ${renderModuloActivo()}
    </div>
  </div>
  ${esAdmin ? modalUsuariosSiCorresponde() : ""}
  ${modalConfiguracionSiCorresponde()}
  ${confirmDialogSiCorresponde()}
  ${modalConceptoSiCorresponde()}
  ${modalGaleriaSiCorresponde()}
  `;
}

const MODULOS_FUNDAMENTOS = [
  { id: "mod0", label: "0. Diagnóstico" },
  { id: "mod1", label: "1. Fundamentos" },
  { id: "mod2", label: "2. Licencias" },

  { id: "mod4", label: "4. Herramientas" },
  { id: "mod5", label: "5. Educación y organizaciones" },
  { id: "mod6", label: "6. Comunidades" },
  { id: "mod7", label: "7. Seguridad y ética" },

];

function sidebarFundamentos(){
  const esAdmin = sesion.rol === "Administrador";
  const usuarioActual = usuarioActualObj() || {};
  const progreso = Array.isArray(usuarioActual.progreso) ? usuarioActual.progreso : [];
  const desbloqueado = modulosDesbloqueados();
  const diagOk = tieneDiagnostico(usuarioActual);
  const prog = progresoUsuario(usuarioActual);

  const modulosHtml = MODULOS_FUNDAMENTOS.map(m => {
    const visto = progreso.includes(m.id);
    const bloqueado = !desbloqueado && m.id !== "mod0";
    const activo = m.id === moduloActivo;
    return `
    <button class="nav-btn modulo-btn ${bloqueado ? "bloqueado" : ""} ${activo ? "current" : ""}" data-mod="${m.id}" ${bloqueado ? `data-bloqueado="1"` : ``}>
      <span class="modulo-label">${m.label}</span>
      ${bloqueado ? `<span class="modulo-lock" title="Módulo bloqueado">Bloqueado</span>`
                  : (visto ? `<span class="modulo-check" title="Módulo completado">✓</span>` : ``)}
    </button>`;
  }).join("");

  const estadoDiag = diagOk
    ? `<div class="progreso-text" style="color:var(--ok); font-weight:600;">Diagnóstico completado</div>
       <div style="margin-top:6px;">${chipNivel(usuarioActual.diagnostico.nivel || nivelPorPorcentaje(usuarioActual.diagnostico.porcentaje))}</div>`
    : (esAdmin
        ? `<div class="progreso-text" style="color:var(--accent);">Vista de administrador</div>`
        : `<div class="progreso-text" style="color:var(--accent3); font-weight:600;">Diagnóstico pendiente</div>`);

  return `
  <div class="sidebar" id="sidebarPrincipal">
    <div class="logo">
      <span>SL · Plataforma</span>
      <button class="btn-menu" id="btnMenu">Menú</button>
    </div>
    <div class="nav-oculto">
      <button class="nav-btn" id="navInicio">Inicio</button>
      <button class="nav-btn active" id="navFundamentos">Módulos del curso</button>
      ${esAdmin ? `<button class="nav-btn" id="navEstadisticas">Panel de estadísticas</button>` : ``}

      <div class="progreso-box">
        <div class="progreso-label">Tu progreso: ${prog.porcentaje}%</div>
        <div class="progreso-bar"><div class="progreso-fill" id="progresoFill" style="width:${prog.porcentaje}%"></div></div>
        <div class="progreso-text" id="progresoTexto">${prog.vistos} / ${prog.total} módulos vistos (${prog.porcentaje}%)</div>
        ${estadoDiag}
      </div>

      <div class="modulos-list" id="modulosList">${modulosHtml}</div>

      <div class="sidebar-bottom">
        ${esAdmin ? `<button class="nav-btn" id="navUsuarios">Usuarios</button>` : ``}

        <button class="nav-btn btn-danger" style="color:#fff;" id="navSalir">Cerrar sesión</button>
      </div>
    </div>
  </div>`;
}

function nivelPorPorcentaje(p){
  if(p >= 90) return "Avanzado";
  if(p >= 70) return "Intermedio";
  if(p >= 50) return "Básico";
  return "Inicial";
}

function chipNivel(nivel, extra){
  const n = NIVELES[nivel] || NIVELES["Inicial"];
  return `<span class="nivel-chip ${n.cls}">Nivel ${escapeHtml(nivel)}${extra ? " " + extra : ""}</span>`;
}

/* ---------- ESTADO DEL USUARIO ---------- */
function usuarioActualObj(){
  return sesion ? (usuarios.find(u => u.id === sesion.id) || null) : null;
}
function esAdminSesion(){
  return !!sesion && sesion.rol === "Administrador";
}
function tieneDiagnostico(u){
  return !!(u && u.diagnostico && u.diagnostico.completado);
}
function modulosDesbloqueados(){
  return esAdminSesion() || tieneDiagnostico(usuarioActualObj());
}
function progresoUsuario(u){
  const progreso = (u && Array.isArray(u.progreso)) ? u.progreso : [];
  const total = MODULOS_FUNDAMENTOS.length;
  const vistos = progreso.filter(id => MODULOS_FUNDAMENTOS.some(m => m.id === id)).length;
  return { total, vistos, porcentaje: total ? Math.round((vistos / total) * 100) : 0 };
}

/* ---------- ASOCIACIÓN VISUAL ---------- */
const asocEstado = {};  // { modId: { sel:null, resueltos:[], errores:0 } }

function estadoAsoc(modId){
  if(!asocEstado[modId]) asocEstado[modId] = { sel:null, resueltos:[], errores:0, msg:"", msgCls:"" };
  return asocEstado[modId];
}

function bloqueAsociacion(modId, cfg){
  const st = estadoAsoc(modId);
  const pares = cfg.pares;
  const derechas = pares.map((p, i) => ({ texto:p.der, i })).slice().reverse();

  const izqHtml = pares.map((p, i) => {
    const ok = st.resueltos.includes(i);
    return `<button class="asoc-item ${ok ? "ok" : ""} ${st.sel === i ? "sel" : ""}"
              data-asoc-izq="${modId}" data-idx="${i}" ${ok ? "disabled" : ""}>
              ${ok ? "✓ " : ""}${escapeHtml(p.izq)}
            </button>`;
  }).join("");

  const derHtml = derechas.map(d => {
    const ok = st.resueltos.includes(d.i);
    return `<button class="asoc-item ${ok ? "ok" : ""}" data-asoc-der="${modId}" data-idx="${d.i}" ${ok ? "disabled" : ""}>
              ${ok ? "✓ " : ""}${escapeHtml(d.texto)}
            </button>`;
  }).join("");

  const completo = st.resueltos.length === pares.length;

  return `
  <div class="bloque-inter" id="asoc-${modId}">
    <div class="bloque-inter-titulo">${escapeHtml(cfg.titulo)}</div>
    <div class="bloque-inter-sub">Selecciona un elemento de la izquierda y luego su pareja de la derecha.</div>
    <div class="asoc-box">
      <div class="asoc-grid">
        <div>
          <div class="asoc-col-tit">Elemento</div>
          ${izqHtml}
        </div>
        <div>
          <div class="asoc-col-tit">Característica</div>
          ${derHtml}
        </div>
      </div>
      <div class="asoc-feedback ${st.msgCls}">${st.msg || ""}</div>
      <div class="asoc-progreso">${st.resueltos.length} de ${pares.length} parejas correctas${st.errores ? ` · ${st.errores} intento(s) fallido(s)` : ""}${completo ? " · Actividad completada" : ""}</div>
    </div>
  </div>`;
}

function refrescarAsociacion(modId){
  const cfg = INTERACTIVO[modId] && INTERACTIVO[modId].asociar;
  const cont = document.getElementById("asoc-" + modId);
  if(cfg && cont) cont.outerHTML = bloqueAsociacion(modId, cfg);
}

function clicAsocIzq(modId, idx){
  const st = estadoAsoc(modId);
  if(st.resueltos.includes(idx)) return;
  st.sel = (st.sel === idx) ? null : idx;
  st.msg = ""; st.msgCls = "";
  refrescarAsociacion(modId);
}

function clicAsocDer(modId, idx){
  const cfg = INTERACTIVO[modId] && INTERACTIVO[modId].asociar;
  if(!cfg) return;
  const st = estadoAsoc(modId);

  if(st.sel === null){
    st.msg = "Selecciona primero un elemento de la columna izquierda.";
    st.msgCls = "";
    refrescarAsociacion(modId);
    return;
  }

  const par = cfg.pares[st.sel];
  if(st.sel === idx){
    st.resueltos.push(idx);
    st.msg = `Correcto — ${par.exp}`;
    st.msgCls = "ok";
    st.sel = null;
    if(st.resueltos.length === cfg.pares.length){
      toast("Actividad completada", "Relacionaste correctamente todos los elementos.");
    }
  }else{
    st.errores++;
    st.msg = `Incorrecto — revisa la característica de ${escapeHtml(par.izq)} e inténtalo de nuevo.`;
    st.msgCls = "bad";
    st.sel = null;
  }
  refrescarAsociacion(modId);
}

/* ================================================================
   ESTADÍSTICAS DEL GRUPO (ADMINISTRADOR)
   ================================================================ */
let filtroEst = "todos";
let busquedaEst = "";
let ordenEst = { campo:"nombre", dir:1 };
let chartsActivos = [];

function listaEstudiantes(){
  return usuarios.filter(u => u.rol === "Usuario");
}

function calcularEstadisticas(lista){
  const base = Array.isArray(lista) ? lista : listaEstudiantes();
  const completados = base.filter(tieneDiagnostico);
  const niveles = { "Inicial":0, "Básico":0, "Intermedio":0, "Avanzado":0 };
  const rangos = { "0-49%":0, "50-69%":0, "70-89%":0, "90-100%":0 };

  let sumaNota = 0, sumaPct = 0, mayor = null, menor = null;

  completados.forEach(u => {
    const d = u.diagnostico;
    const nivel = d.nivel || nivelPorPorcentaje(d.porcentaje);
    if(niveles[nivel] === undefined) niveles[nivel] = 0;
    niveles[nivel]++;

    const p = Number(d.porcentaje) || 0;
    if(p < 50) rangos["0-49%"]++;
    else if(p < 70) rangos["50-69%"]++;
    else if(p < 90) rangos["70-89%"]++;
    else rangos["90-100%"]++;

    sumaNota += Number(d.nota) || 0;
    sumaPct += p;
    if(mayor === null || p > mayor) mayor = p;
    if(menor === null || p < menor) menor = p;
  });

  const total = base.length;
  const hechos = completados.length;

  return {
    total,
    completados: hechos,
    pendientes: total - hechos,
    participacion: total ? Math.round((hechos / total) * 100) : 0,
    niveles,
    rangos,
    promedioNota: hechos ? Math.round((sumaNota / hechos) * 10) / 10 : 0,
    promedioPorcentaje: hechos ? Math.round(sumaPct / hechos) : 0,
    mayor: mayor === null ? 0 : mayor,
    menor: menor === null ? 0 : menor
  };
}

function estudiantesFiltrados(){
  let lista = listaEstudiantes();

  if(filtroEst === "completado") lista = lista.filter(tieneDiagnostico);
  else if(filtroEst === "pendiente") lista = lista.filter(u => !tieneDiagnostico(u));
  else if(ORDEN_NIVELES.includes(filtroEst)){
    lista = lista.filter(u => tieneDiagnostico(u) && (u.diagnostico.nivel || nivelPorPorcentaje(u.diagnostico.porcentaje)) === filtroEst);
  }

  const q = busquedaEst.trim().toLowerCase();
  if(q){
    lista = lista.filter(u => String(u.nombre).toLowerCase().includes(q) ||
      String(u.usuario).toLowerCase().includes(q)
    );
  }

  const campo = ordenEst.campo, dir = ordenEst.dir;
  lista = lista.slice().sort((a, b) => {
    const va = valorOrden(a, campo), vb = valorOrden(b, campo);
    if(va < vb) return -1 * dir;
    if(va > vb) return 1 * dir;
    return 0;
  });

  return lista;
}

function valorOrden(u, campo){
  const d = u.diagnostico || null;
  switch(campo){
    case "nombre": return String(u.nombre).toLowerCase();
    case "usuario": return String(u.usuario).toLowerCase();
    case "estado": return tieneDiagnostico(u) ? 0 : 1;
    case "nivel": return tieneDiagnostico(u) ? ORDEN_NIVELES.indexOf(d.nivel || nivelPorPorcentaje(d.porcentaje)) : -1;
    case "resultado": return tieneDiagnostico(u) ? Number(d.porcentaje) || 0 : -1;
    case "fecha": return tieneDiagnostico(u) ? (d.timestamp || 0) : -1;
    default: return 0;
  }
}

function refrescarPanelEstadisticas(){
  const est = calcularEstadisticas(estudiantesFiltrados());
  const kpis = document.getElementById("kpisWrap");
  if(kpis) kpis.innerHTML = kpisHtml(est);
  const tabla = document.getElementById("tablaWrap");
  if(tabla) tabla.innerHTML = tablaEstudiantesHtml();
  document.querySelectorAll("[data-filtro]").forEach(b => {
    b.classList.toggle("activo", b.getAttribute("data-filtro") === filtroEst);
  });
  bindTablaEstadisticas();
  dibujarGraficos();
}

function bindTablaEstadisticas(){
  document.querySelectorAll("[data-orden]").forEach(th => {
    th.addEventListener("click", () => {
      const campo = th.getAttribute("data-orden");
      if(ordenEst.campo === campo) ordenEst.dir *= -1;
      else ordenEst = { campo, dir:1 };
      refrescarPanelEstadisticas();
    });
  });
}

function initPanelEstadisticas(){
  const buscador = document.getElementById("buscadorEst");
  if(buscador){
    buscador.addEventListener("input", () => {
      busquedaEst = buscador.value;
      const tabla = document.getElementById("tablaWrap");
      if(tabla) tabla.innerHTML = tablaEstudiantesHtml();
      const kpis = document.getElementById("kpisWrap");
      if(kpis) kpis.innerHTML = kpisHtml(calcularEstadisticas(estudiantesFiltrados()));
      bindTablaEstadisticas();
      dibujarGraficos();
    });
  }

  document.querySelectorAll("[data-filtro]").forEach(btn => {
    btn.addEventListener("click", () => {
      filtroEst = btn.getAttribute("data-filtro");
      refrescarPanelEstadisticas();
    });
  });

  bindTablaEstadisticas();
  dibujarGraficos();
}

/* ---------- GRÁFICOS (Chart.js con respaldo en CSS) ---------- */
function destruirGraficos(){
  chartsActivos.forEach(c => { try{ c.destroy(); }catch(e){} });
  chartsActivos = [];
}

function barrasRespaldo(datos, colores, maximo){
  const max = maximo || Math.max(1, ...datos.map(d => d.valor));
  return `<div class="fallback-bars">${datos.map((d, i) => `
    <div class="fb-row">
      <span class="fb-lbl">${escapeHtml(d.etiqueta)}</span>
      <span class="fb-track"><span class="fb-fill" style="width:${Math.round((d.valor / max) * 100)}%; background:${colores[i % colores.length]};"></span></span>
      <span class="fb-val">${d.valor}${d.sufijo || ""}</span>
    </div>`).join("")}</div>`;
}

function dibujarGraficos(){
  if(vista !== "estadisticas") return;
  destruirGraficos();

  const est = calcularEstadisticas(estudiantesFiltrados());
  const colNiveles = ["#ff9f43","#1971c2","#6c5ce7","#12b886"];
  const datosNiveles = ORDEN_NIVELES.map(n => est.niveles[n] || 0);
  const etiquetasRangos = ["0-49%","50-69%","70-89%","90-100%"];
  const datosRangos = etiquetasRangos.map(r => est.rangos[r] || 0);

  const hayChart = (typeof window !== "undefined" && typeof window.Chart !== "undefined");

  if(!hayChart){
    const w1 = document.getElementById("wrapChartNiveles");
    if(w1) w1.innerHTML = barrasRespaldo(ORDEN_NIVELES.map((n,i) => ({ etiqueta:n, valor:datosNiveles[i] })), colNiveles);
    const w2 = document.getElementById("wrapChartParticipacion");
    if(w2) w2.innerHTML = barrasRespaldo([
      { etiqueta:"Completados", valor:est.completados },
      { etiqueta:"Pendientes", valor:est.pendientes }
    ], ["#12b886","#ff9f43"]);
    const w3 = document.getElementById("wrapChartRangos");
    if(w3) w3.innerHTML = barrasRespaldo(etiquetasRangos.map((r,i) => ({ etiqueta:r, valor:datosRangos[i] })), ["#ff6b6b","#ff9f43","#6c5ce7","#12b886"]);
    return;
  }

  const cN = document.getElementById("chartNiveles");
  if(cN){
    chartsActivos.push(new window.Chart(cN, {
      type:"bar",
      data:{ labels:ORDEN_NIVELES, datasets:[{ label:"Estudiantes", data:datosNiveles, backgroundColor:colNiveles, borderRadius:8 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
    }));
  }

  const cP = document.getElementById("chartParticipacion");
  if(cP){
    chartsActivos.push(new window.Chart(cP, {
      type:"doughnut",
      data:{ labels:["Diagnóstico completado","Pendiente"],
             datasets:[{ data:[est.completados, est.pendientes], backgroundColor:["#12b886","#ff9f43"], borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:"62%",
        plugins:{ legend:{ position:"bottom", labels:{ boxWidth:12, font:{ size:11 } } } } }
    }));
  }

  const cR = document.getElementById("chartRangos");
  if(cR){
    chartsActivos.push(new window.Chart(cR, {
      type:"bar",
      data:{ labels:etiquetasRangos, datasets:[{ label:"Estudiantes", data:datosRangos,
             backgroundColor:["#ff6b6b","#ff9f43","#6c5ce7","#12b886"], borderRadius:8 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
    }));
  }
}

/* ================================================================
   DELEGACIÓN GLOBAL DE EVENTOS (se registra una sola vez)
   ================================================================ */
function bindDelegacionGlobal(){
  document.addEventListener("click", (e) => {
    if(manejarClicVisual(e)) return;
    const card = e.target.closest("[data-concepto]:not([data-concepto-id])");
    if(card && card.hasAttribute("data-concepto")){
      abrirConcepto(card.getAttribute("data-concepto"));
      return;
    }
    const dx = e.target.closest("[data-descubre]");
    if(dx){
      seleccionarDescubre(dx.getAttribute("data-descubre"), dx.getAttribute("data-concepto-id"));
      return;
    }
    const ai = e.target.closest("[data-asoc-izq]");
    if(ai){
      clicAsocIzq(ai.getAttribute("data-asoc-izq"), parseInt(ai.getAttribute("data-idx"), 10));
      return;
    }
    const ad = e.target.closest("[data-asoc-der]");
    if(ad){
      clicAsocDer(ad.getAttribute("data-asoc-der"), parseInt(ad.getAttribute("data-idx"), 10));
      return;
    }
    const overlayConcepto = document.getElementById("overlayConcepto");
    if(overlayConcepto && e.target === overlayConcepto){
      conceptoAbierto = null;
      render();
    }
  });

  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && (conceptoAbierto || galeriaAbierta)){
      conceptoAbierto = null;
      galeriaAbierta = null;
      render();
    }
    if(e.key === "Enter" || e.key === " "){
      const card = document.activeElement;
      if(card && card.classList && card.classList.contains("concept-card")){
        e.preventDefault();
        abrirConcepto(card.getAttribute("data-concepto"));
      }
    }
  });
}
