const vfEstado = {};

function bloqueVerdaderoFalso(modId){
  const items = VF_MODULOS[modId];
  if(!items) return "";
  if(!vfEstado[modId]) vfEstado[modId] = {};
  const st = vfEstado[modId];
  const respondidas = Object.keys(st).length;
  const aciertos = Object.keys(st).filter(k => st[k] === items[k][1]).length;

  return `
  <div class="bloque-inter" id="vf-${modId}">
    <div class="bloque-inter-titulo">Comprueba lo aprendido</div>
    <div class="bloque-inter-sub">Decide si cada afirmación es verdadera o falsa y revisa la explicación.</div>
    ${items.map((it, i) => {
      const resp = st[i];
      const contestada = resp !== undefined;
      const acerto = contestada && resp === it[1];
      return `
      <div class="vf-item">
        <div class="vf-frase">${i + 1}. ${escapeHtml(it[0])}</div>
        <div class="vf-botones">
          <button class="vf-btn ${contestada && resp === true ? (acerto ? "ok" : "bad") : ""}" data-vf="${modId}" data-idx="${i}" data-val="v">Verdadero</button>
          <button class="vf-btn ${contestada && resp === false ? (acerto ? "ok" : "bad") : ""}" data-vf="${modId}" data-idx="${i}" data-val="f">Falso</button>
        </div>
        ${contestada ? `<div class="vf-exp"><b class="${acerto ? "ok" : "bad"}">${acerto ? "✓ Correcto." : "✗ Incorrecto."}</b> ${escapeHtml(it[2])}</div>` : ``}
      </div>`;
    }).join("")}
    <div class="vf-marcador">${respondidas} de ${items.length} respondidas · ${aciertos} acierto(s)</div>
  </div>`;
}

/* ---------- COMPONENTE INTERACTIVO PROPIO DE CADA MÓDULO ---------- */
function componenteModulo(modId){
  switch(modId){
    case "mod1": return bloqueLineaTiempo();
    case "mod2": return bloqueWizardLicencias();
    case "mod3": return bloqueTerminal();
    case "mod4": return bloqueComparador();
    case "mod5": return bloqueAntesDespues();
    case "mod6": return bloqueFlujoContribucion();
    case "mod7": return bloqueChecklist("mod7");
    case "mod8": return bloqueChecklist("mod8");
    default: return "";
  }
}

/* ---------- REDIBUJADO PARCIAL ---------- */
function refrescarBloque(id, html){
  const el = document.getElementById(id);
  if(el) el.outerHTML = html;
}

/* ---------- DELEGACIÓN DE LOS NUEVOS COMPONENTES ---------- */
function manejarClicVisual(e){
  const gal = e.target.closest("[data-galeria]");
  if(gal){
    galeriaAbierta = { modId: gal.getAttribute("data-galeria"), idx: parseInt(gal.getAttribute("data-idx"), 10) };
    render();
    return true;
  }

  const tl = e.target.closest("[data-tl]");
  if(tl){
    tlSel = parseInt(tl.getAttribute("data-tl"), 10);
    refrescarBloque("linea-tiempo", bloqueLineaTiempo());
    return true;
  }

  const wz = e.target.closest("[data-wiz]");
  if(wz){
    const campo = wz.getAttribute("data-wiz");
    if(campo === "reset") wizEstado = { q1:null, q2:null };
    else wizEstado[campo] = wz.getAttribute("data-val");
    refrescarBloque("wiz-licencias", bloqueWizardLicencias());
    return true;
  }

  const tm = e.target.closest("[data-term]");
  if(tm){
    const v = tm.getAttribute("data-term");
    if(v === "clear") termLineas = [];
    else termLineas = termLineas.concat([COMANDOS[parseInt(v, 10)]]).slice(-6);
    refrescarBloque("terminal-sim", bloqueTerminal());
    const cuerpo = document.getElementById("termCuerpo");
    if(cuerpo) cuerpo.scrollTop = cuerpo.scrollHeight;
    return true;
  }

  const tb = e.target.closest("[data-tab]");
  if(tb){
    tabSel = parseInt(tb.getAttribute("data-tab"), 10);
    refrescarBloque("comparador-herramientas", bloqueComparador());
    return true;
  }

  const ad = e.target.closest("[data-ad]");
  if(ad){
    adModo = ad.getAttribute("data-ad");
    refrescarBloque("antes-despues", bloqueAntesDespues());
    return true;
  }

  const ps = e.target.closest("[data-paso]");
  if(ps){
    pasoSel = parseInt(ps.getAttribute("data-paso"), 10);
    refrescarBloque("flujo-contribucion", bloqueFlujoContribucion());
    return true;
  }

  const ck = e.target.closest("[data-check]");
  if(ck){
    const modId = ck.getAttribute("data-check");
    const idx = parseInt(ck.getAttribute("data-idx"), 10);
    if(!checkEstado[modId]) checkEstado[modId] = [];
    const lista = checkEstado[modId];
    const pos = lista.indexOf(idx);
    if(pos >= 0) lista.splice(pos, 1); else lista.push(idx);
    refrescarBloque("check-" + modId, bloqueChecklist(modId));
    if(lista.length === CHECKLISTS[modId].items.length){
      toast("Lista completada", "Verificaste todos los puntos de la lista.");
    }
    return true;
  }

  const vf = e.target.closest("[data-vf]");
  if(vf){
    const modId = vf.getAttribute("data-vf");
    const idx = parseInt(vf.getAttribute("data-idx"), 10);
    if(!vfEstado[modId]) vfEstado[modId] = {};
    vfEstado[modId][idx] = vf.getAttribute("data-val") === "v";
    refrescarBloque("vf-" + modId, bloqueVerdaderoFalso(modId));
    return true;
  }

  const ovG = document.getElementById("overlayGaleria");
  if(ovG && e.target === ovG){
    galeriaAbierta = null;
    render();
    return true;
  }

  return false;
}

/* ============ HELPERS ============ */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ============ EVENTOS ============ */
function bindEventos(){

  const btnLogin = document.getElementById("btnIniciarSesion");
  if(btnLogin) btnLogin.addEventListener("click", iniciarSesion);
  const btnIrRegistro = document.getElementById("btnIrRegistro");

  if(btnRegistrar) btnRegistrar.addEventListener("click", registrarUsuario);

  if(btnVolverLogin) btnVolverLogin.addEventListener("click", () => { vista = "login"; render(); });

  // SIDEBAR
  const navInicio = document.getElementById("navInicio");
  if(navInicio) navInicio.addEventListener("click", () => { vista = "dashboard"; render(); });
  const navFundamentos = document.getElementById("navFundamentos");
  if(navFundamentos) navFundamentos.addEventListener("click", () => { vista = "fundamentos"; render(); });
  const navUsuarios = document.getElementById("navUsuarios");
  if(navUsuarios) navUsuarios.addEventListener("click", abrirUsuarios);
  const navConfiguracion = document.getElementById("navConfiguracion");
  if(navConfiguracion) navConfiguracion.addEventListener("click", abrirConfiguracion);
  const navSalir = document.getElementById("navSalir");
  if(navSalir) navSalir.addEventListener("click", () => {
    // Los resultados NO se borran: quedan guardados en el almacenamiento asociados al usuario
    sesion = null; vista = "login";
    modalUsuariosAbierto = false; modalConfiguracionAbierto = false;
    confirmEliminar = null; conceptoAbierto = null;
    destruirGraficos();
    render();
    toast("Sesión cerrada", "Tus resultados y tu progreso quedaron guardados.");
  });

  // CARTILLA
  const btnCargarCartilla = document.getElementById("btnCargarCartilla");
  const inputCartilla = document.getElementById("inputCartilla");
  if(btnCargarCartilla && inputCartilla){
    btnCargarCartilla.addEventListener("click", () => inputCartilla.click());
    inputCartilla.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      await guardarCartilla(file.name);
      toast("Cartilla cargada", "La cartilla se cargó correctamente. Su visualización dentro del módulo se habilitará en una futura versión.");
      render();
    });
  }

  // MODAL USUARIOS
  const btnCerrarUsuarios = document.getElementById("btnCerrarUsuarios");
  if(btnCerrarUsuarios) btnCerrarUsuarios.addEventListener("click", () => { modalUsuariosAbierto = false; render(); });
  document.querySelectorAll("[data-eliminar]").forEach(btn => {
    btn.addEventListener("click", () => {
      confirmEliminar = { id: parseInt(btn.getAttribute("data-eliminar")), nombre: btn.getAttribute("data-nombre") };
      render();
    });
  });

  // MODAL CONFIGURACIÓN
  const btnCerrarConfiguracion = document.getElementById("btnCerrarConfiguracion");
  if(btnCerrarConfiguracion) btnCerrarConfiguracion.addEventListener("click", () => { modalConfiguracionAbierto = false; render(); });
  const btnGuardarConfiguracion = document.getElementById("btnGuardarConfiguracion");
  if(btnGuardarConfiguracion) btnGuardarConfiguracion.addEventListener("click", guardarConfiguracion);

  // CONFIRM ELIMINAR
  const btnCancelarEliminar = document.getElementById("btnCancelarEliminar");
  if(btnCancelarEliminar) btnCancelarEliminar.addEventListener("click", () => { confirmEliminar = null; render(); });
  const btnConfirmarEliminar = document.getElementById("btnConfirmarEliminar");
  if(btnConfirmarEliminar) btnConfirmarEliminar.addEventListener("click", eliminarUsuario);

  // Enter para iniciar sesión
  const loginPass = document.getElementById("loginPass");
  if(loginPass) loginPass.addEventListener("keydown", e => { if(e.key === "Enter") iniciarSesion(); });

  // MÓDULOS INDEPENDIENTES (Fundamentos SL)
  if(vista === "fundamentos") bindModulosIndependientes();

  // PRUEBA DIAGNÓSTICA
  const btnCalificarDiag = document.getElementById("btnCalificarDiag");
  if(btnCalificarDiag) btnCalificarDiag.addEventListener("click", calificarDiagnostico);
  const btnReiniciarDiag = document.getElementById("btnReiniciarDiag");
  if(btnReiniciarDiag) btnReiniciarDiag.addEventListener("click", reiniciarDiagnostico);
  const btnContinuarCurso = document.getElementById("btnContinuarCurso");
  if(btnContinuarCurso) btnContinuarCurso.addEventListener("click", () => irAModulo("mod1"));

  // ====== NUEVO EN LA V6 ======
  // Navegación al panel de estadísticas (solo administradores)
  const navEstadisticas = document.getElementById("navEstadisticas");
  if(navEstadisticas) navEstadisticas.addEventListener("click", abrirEstadisticas);
  const btnIrEstadisticas = document.getElementById("btnIrEstadisticas");
  if(btnIrEstadisticas) btnIrEstadisticas.addEventListener("click", abrirEstadisticas);

  // Accesos del panel del estudiante
  const btnComenzarDiagnostico = document.getElementById("btnComenzarDiagnostico");
  if(btnComenzarDiagnostico) btnComenzarDiagnostico.addEventListener("click", irAlDiagnostico);
  const btnIrModulos = document.getElementById("btnIrModulos");
  if(btnIrModulos) btnIrModulos.addEventListener("click", () => {
    if(modulosDesbloqueados()) irAModulo(moduloActivo === "mod0" ? "mod1" : moduloActivo);
    else irAlDiagnostico();
  });

  // Cerrar el modal de concepto
  const btnCerrarConcepto = document.getElementById("btnCerrarConcepto");
  if(btnCerrarConcepto) btnCerrarConcepto.addEventListener("click", () => { conceptoAbierto = null; render(); });
  const btnCerrarGaleria = document.getElementById("btnCerrarGaleria");
  if(btnCerrarGaleria) btnCerrarGaleria.addEventListener("click", () => { galeriaAbierta = null; render(); });

  // Menú lateral colapsable en pantallas pequeñas
  const sidebarEl = document.getElementById("sidebarPrincipal");
  const btnMenu = document.getElementById("btnMenu");
  if(sidebarEl && window.innerWidth <= 760) sidebarEl.classList.add("colapsado");
  if(btnMenu && sidebarEl){
    btnMenu.addEventListener("click", () => sidebarEl.classList.toggle("colapsado"));
  }

  // Panel de estadísticas (tabla, filtros y gráficos)
  if(vista === "estadisticas") initPanelEstadisticas();
  else destruirGraficos();
}

/* Cambia de módulo dentro del curso, revisando el bloqueo antes de saltar */
function irAModulo(modId){
  if(modId !== "mod0" && !modulosDesbloqueados()){
    toast("Módulo bloqueado", "Debes completar primero el diagnóstico inicial.", true);

/* ============ ACCIONES ============ */
async function registrarUsuario(){
  const adminUsuario = document.getElementById("adminUsuario").value.trim();
  const adminPass = document.getElementById("adminPass").value;
  const nombre = document.getElementById("regNombre").value.trim();
  const usuario = document.getElementById("regUsuario").value.trim();
  const contrasena = document.getElementById("regPass").value;
  const rol = document.getElementById("regRol").value;

  const administradoresPermitidos = {
    "cristian": "12345",
    "javier": "12345"
  };

  // Solo Cristian o Javier pueden crear usuarios y asignar roles.
  if(administradoresPermitidos[adminUsuario.toLowerCase()] !== adminPass){
    toast("Acceso denegado", "Solo Cristian o Javier, con su clave correspondiente, pueden crear usuarios.", true);
    return;
  }

  if(!nombre || !usuario || !contrasena){
    toast("Advertencia", "Todos los campos del nuevo usuario son obligatorios.", true);
    return;
  }

  if(usuarios.some(u => u.usuario.toLowerCase() === usuario.toLowerCase())){
    toast("Error", "El usuario ya existe.", true);
    return;
  }

  const hash = await encriptarContrasena(contrasena);
  usuarios.push({
    id: siguienteId(),
    nombre,
    usuario,
    contrasena: hash,
    rol,
    protegido: false,
    progreso: []
  });
  await guardarUsuarios();

  toast("Éxito", `Usuario '${usuario}' creado con rol ${rol}.`);
  vista = "login";
  render();
}

async function iniciarSesion(){
  const usuario = document.getElementById("loginUsuario").value.trim();
  const contrasena = document.getElementById("loginPass").value;
  const hash = await encriptarContrasena(contrasena);

  const encontrado = usuarios.find(u => u.usuario === usuario && u.contrasena === hash);
  if(encontrado){
    sesion = { id: encontrado.id, nombre: encontrado.nombre, usuario: encontrado.usuario, rol: encontrado.rol };
    vista = "dashboard";
    render();
    if(encontrado.rol === "Administrador"){
      toast("Sesión iniciada", `Bienvenido ${encontrado.nombre}. Tienes acceso al panel de estadísticas del grupo.`);
    }else if(tieneDiagnostico(encontrado)){
      const n = encontrado.diagnostico.nivel || nivelPorPorcentaje(encontrado.diagnostico.porcentaje);
      toast("Sesión iniciada", `Diagnóstico completado · Nivel ${n}. Tus módulos siguen desbloqueados.`);
    }else{
      toast("Diagnóstico pendiente", "Debes completar primero el diagnóstico inicial para acceder a los módulos.", true);
    }
  }else{
    toast("Error", "Usuario o contraseña incorrectos.", true);
  }
}

/* ============ SEGUIMIENTO DE MÓDULOS Y PROGRESO ============ */
/* Cada módulo es una página independiente: los botones del menú lateral,
   los pasos del flujo y los botones "anterior/siguiente" saltan directamente
   al módulo elegido, sin desplazamiento por una página única. */
function bindModulosIndependientes(){
  document.querySelectorAll("[data-mod]").forEach(btn => {
    btn.addEventListener("click", () => irAModulo(btn.getAttribute("data-mod")));
  });
  document.querySelectorAll("[data-ir-modulo]").forEach(btn => {
    btn.addEventListener("click", () => irAModulo(btn.getAttribute("data-ir-modulo")));
  });

  // Al abrir un módulo del curso se registra como visto en el progreso del estudiante
  if(moduloActivo) marcarModuloVisto(moduloActivo);
}

async function marcarModuloVisto(modId){
  const usuarioActual = usuarios.find(u => u.id === sesion.id);
  if(!usuarioActual) return;
  if(modId !== "mod0" && !modulosDesbloqueados()) return;
  if(!Array.isArray(usuarioActual.progreso)) usuarioActual.progreso = [];
  if(usuarioActual.progreso.includes(modId)) return; // ya estaba registrado

  usuarioActual.progreso.push(modId);
  guardarUsuariosDiferido();

  const total = MODULOS_FUNDAMENTOS.length;
  const vistos = usuarioActual.progreso.length;
  const porcentaje = total ? Math.round((vistos / total) * 100) : 0;

  const fill = document.getElementById("progresoFill");
  const texto = document.getElementById("progresoTexto");
  if(fill) fill.style.width = porcentaje + "%";
  if(texto) texto.textContent = `${vistos} / ${total} módulos vistos (${porcentaje}%)`;
  const etiquetaProg = document.querySelector(".progreso-label");
  if(etiquetaProg) etiquetaProg.textContent = `Tu progreso: ${porcentaje}%`;

  const btn = document.querySelector(`.modulo-btn[data-mod="${modId}"]`);
  if(btn && !btn.querySelector(".modulo-check")){
    const check = document.createElement("span");
    check.className = "modulo-check";
    check.title = "Módulo visto";
    check.textContent = "✓";
    btn.appendChild(check);
  }
}

function abrirConfiguracion(){
  modalConfiguracionAbierto = true;
  render();
}

async function guardarConfiguracion(){
  const usuarioActual = usuarios.find(u => u.id === sesion.id);
  if(!usuarioActual){
    toast("Error", "No se encontró la cuenta actual.", true);
    return;
  }

  const nombre = document.getElementById("cfgNombre").value.trim();
  const nuevoUsuario = document.getElementById("cfgUsuario").value.trim();
  const passNueva = document.getElementById("cfgPassNueva").value;
  const passConfirmar = document.getElementById("cfgPassConfirmar").value;
  const passActual = document.getElementById("cfgPassActual").value;

  if(!nombre || !nuevoUsuario){
    toast("Advertencia", "El nombre y el nombre de usuario son obligatorios.", true);
    return;
  }

  if(!passActual){
    toast("Advertencia", "Debes ingresar tu contraseña actual para guardar los cambios.", true);
    return;
  }

  const hashActual = await encriptarContrasena(passActual);
  if(hashActual !== usuarioActual.contrasena){
    toast("Acceso denegado", "La contraseña actual es incorrecta.", true);
    return;
  }

  if(passNueva || passConfirmar){
    if(passNueva.length < 4){
      toast("Advertencia", "La nueva contraseña debe tener al menos 4 caracteres.", true);
      return;
    }
    if(passNueva !== passConfirmar){
      toast("Advertencia", "Las contraseñas nuevas no coinciden.", true);
      return;
    }
  }

  const usuarioDuplicado = usuarios.some(u => u.id !== usuarioActual.id && u.usuario.toLowerCase() === nuevoUsuario.toLowerCase());
  if(usuarioDuplicado){
    toast("Error", "Ese nombre de usuario ya está en uso por otra cuenta.", true);
    return;
  }

  usuarioActual.nombre = nombre;
  usuarioActual.usuario = nuevoUsuario;
  if(passNueva){
    usuarioActual.contrasena = await encriptarContrasena(passNueva);
  }

  await guardarUsuarios();

  sesion.nombre = usuarioActual.nombre;
  sesion.usuario = usuarioActual.usuario;

  modalConfiguracionAbierto = false;
  toast("Éxito", "Los datos de tu cuenta se actualizaron correctamente.");
  render();
}

function abrirUsuarios(){
  if(sesion.rol !== "Administrador"){
    toast("Acceso denegado", "Solo un administrador puede ver la lista de usuarios registrados.", true);
    return;
  }
  modalUsuariosAbierto = true;
  render();
}

async function eliminarUsuario(){
  if(sesion.rol !== "Administrador"){
    toast("Acceso denegado", "Solo un administrador puede eliminar usuarios.", true);
    confirmEliminar = null;
    render();
    return;
  }
  const { id, nombre } = confirmEliminar;
  const usuarioEliminar = usuarios.find(u => u.id === id);

  if(usuarioEliminar?.protegido || ["Cristian", "Javier"].includes(usuarioEliminar?.usuario)){
    toast("Acción no permitida", "Cristian y Javier son administradores principales y no pueden ser eliminados.", true);
    confirmEliminar = null;
    render();
    return;
  }

  usuarios = usuarios.filter(u => u.id !== id);
  await guardarUsuarios();
  confirmEliminar = null;

  toast("Usuario eliminado", `El usuario '${nombre}' fue eliminado correctamente.`);

  if(sesion.usuario === nombre){
    // el administrador se eliminó a sí mismo: se cierra la sesión
    sesion = null;
    modalUsuariosAbierto = false;
    vista = "login";
  }
  render();
}

/* ============ INICIO ============ */
(async function iniciar(){
  bindDelegacionGlobal();
  await cargarUsuarios();
  await cargarCartillaGuardada();
  render();
})();
